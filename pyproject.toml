[tool.pytest.ini_options]
testpaths        = ["backend/tests"]
asyncio_mode     = "auto"
filterwarnings   = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__", "node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]

[tool.mypy]
python_version  = "3.10"
ignore_missing_imports = true
warn_return_any = false
